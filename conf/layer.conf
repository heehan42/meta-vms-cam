# meta-vms-cam: BeagleBone Black을 카메라 장비로 쓰는 이미지와 vms_camera_server 레시피를 제공한다.

BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "vms-cam"
BBFILE_PATTERN_vms-cam = "^${LAYERDIR}/"
BBFILE_PRIORITY_vms-cam = "6"

# 레시피와 이미지에 보드 전용 설정이 없으므로 oe-core에만 의존한다. 보드는 빌드 설정의 MACHINE이 정한다.
LAYERDEPENDS_vms-cam = "core"
LAYERSERIES_COMPAT_vms-cam = "wrynose"
